  # # Create a Security Group allowing RDP access
  # MySecurityGroup01:
  #   Type: AWS::EC2::SecurityGroup
  #   Properties:
  #     GroupDescription: "Allow RDP access"
  #     VpcId: !Ref MyVPC01
