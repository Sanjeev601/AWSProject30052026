# Create an EC2 instance
Resources:
  MyEC2Instance05:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-073ed03c725f813eb" # Amazon windows 2019 base
      InstanceType: "t2.micro"
      SubnetId: subnet-0f121bb7575067145 # replace with your existing public subnet ID
      SecurityGroupIds:
      - sg-0bee0c777de048f78 # replace with your existing security group ID
      Tags:
      - Key: Name
        Value: MyEC2Instance05
      KeyName: "TestKeyPair08" # Replace with your key pair name
      UserData:
        Fn::Base64: |
          $zipUrl = "https://kendralusts3bucket.s3.us-east-1.amazonaws.com/kendralust01.zip"
          $zipDestination = "C:\kendralust01.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipDestination -UseBasicParsing
          Write-Host "Downloaded ZIP from $zipUrl to $zipDestination"
          </powershell>

  # Additional EBS volumes for extra drives
  MyAdditionalVolume10:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 20
      VolumeType: gp3
      Tags:
      - Key: Name
        Value: MyAdditionalVolume10

  MyAdditionalVolume11:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 50
      VolumeType: gp3
      Tags:
      - Key: Name
        Value: MyAdditionalVolume11

  AttachAdditionalDrive12:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdb
      InstanceId: !Ref MyEC2Instance05
      VolumeId: !Ref MyAdditionalVolume10

  AttachAdditionalDrive13:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdc
      InstanceId: !Ref MyEC2Instance05
      VolumeId: !Ref MyAdditionalVolume11
