  #     - IpProtocol: tcp
  #       FromPort: 3389
  #       ToPort: 3389
  #       CidrIp: "0.0.0.0/0"

  # Create an EC2 instance
  MyEC2Instance02:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-073ed03c725f813eb" # Amazon windows 2019 base
      InstanceType: "t2.micro"
      SubnetId: !Ref MyPublicSubnet01
      SecurityGroupIds:
      - !Ref MySecurityGroup01
      Tags:
      - Key: Name
        Value: MyEC2Instance02
      KeyName: "TestKeyPair08" # Replace with your key pair name 

  # Additional EBS volumes for extra drives
  MyAdditionalVolume3:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 20
      VolumeType: gp3
      Tags:
      - Key: Name
        Value: MyAdditionalVolume3

  MyAdditionalVolume4:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 50
      VolumeType: gp3
      Tags:
      - Key: Name
        Value: MyAdditionalVolume4

  AttachAdditionalDrive3:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdb
      InstanceId: !Ref MyEC2Instance02
      VolumeId: !Ref MyAdditionalVolume3

  AttachAdditionalDrive4:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdc
      InstanceId: !Ref MyEC2Instance02
      VolumeId: !Ref MyAdditionalVolume4
